<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Learn more about {{ minister.name }}, {{ minister.role }}, ministering at ECWA Glory Concert.">
    <title>{{ minister.name }} | ECWA Glory Concert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>
<body class="clean-page">
    <nav class="site-nav">
        <div class="site-nav-inner">
            <a class="site-brand" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='images/ECWA LOGO-modified.png') }}" alt="ECWA logo"><span>GLORY<small>CONCERT</small></span></a>
            <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
            <ul class="site-menu">
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('events') }}">Programme</a></li>
                <li><a href="{{ url_for('about') }}">Our story</a></li>
                <li><a href="{{ url_for('gallery_page') }}">Gallery</a></li>
                <li><a href="{{ url_for('contact') }}">Contact</a></li>
                <li><a class="nav-cta" href="{{ url_for('volunteer') }}">Join the team</a></li>
            </ul>
        </div>
    </nav>

    <main class="minister-profile-page" data-aos="fade-up">
        <div class="minister-profile-image"><img src="{{ url_for('static', filename='images/' ~ minister.image) }}" alt="{{ minister.name }}"></div>
        <div class="minister-profile-copy">
            <p class="minister-profile-role">{{ minister.role }}</p>
            <h1>{{ minister.name }}</h1>
            <div class="minister-profile-bio">{{ minister.bio or 'More information about this worship leader will be shared soon.' }}</div>
            <a class="button button-gold" href="{{ url_for('index') }}">Back to home</a>
        </div>
    </main>

    <footer class="simple-footer"><p>&copy; 2026 ECWA Lagos West DCC</p></footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 700, once: true, easing: 'ease-out-cubic' });</script>
</body>
</html>
