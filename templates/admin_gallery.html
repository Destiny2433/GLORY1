<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gallery Management | ECWA Glory</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="section visible"><div class="container">
<p><a href="{{ url_for('admin') }}">Back to dashboard</a></p><h1>Gallery Management</h1>
<form action="{{ url_for('admin_gallery') }}" method="post" enctype="multipart/form-data" class="event-details"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="upload"><label>Images<input type="file" name="images" accept="image/*" multiple required></label><button class="cta-button" type="submit">Upload images</button></form>
<div class="gallery-grid">{% for image in images %}<article class="gallery-item"><img src="{{ url_for('static', filename='images/' ~ image.image_path) }}" alt="Gallery image" loading="lazy"><form action="{{ url_for('admin_gallery') }}" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="delete"><input type="hidden" name="image_id" value="{{ image.id }}"><button type="submit">Delete</button></form></article>{% else %}<p>No images uploaded yet.</p>{% endfor %}</div>
</div></main></body></html>
