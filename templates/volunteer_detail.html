<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Volunteer Submission | ECWA Glory</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="section visible"><div class="container"><p><a href="{{ url_for('admin') }}">Back to submissions</a></p><h1>Volunteer Submission</h1><dl class="event-details"><dt>Full name</dt><dd>{{ volunteer.full_name }}</dd><dt>Email</dt><dd>{{ volunteer.email }}</dd><dt>Phone</dt><dd>{{ volunteer.phone or 'Not provided' }}</dd><dt>Age</dt><dd>{{ volunteer.age or 'Not provided' }}</dd><dt>Team</dt><dd>{{ volunteer.team }}</dd><dt>Submitted</dt><dd>{{ volunteer.submitted_at }}</dd></dl></div></main></body></html>
